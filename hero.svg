<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Shekhar Kumar — Futuristic Developer Profile</title>
<desc id="desc">Animated midnight glass hero for Shekhar Kumar, Full Stack Developer.</desc>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <radialGradient id="bg"><stop stop-color="#15172a"/><stop offset="1" stop-color="#0d0e16"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".08"/></pattern>
  <mask id="reveal"><rect x="0" y="0" width="0" height="100%" fill="white"><animate attributeName="width" from="0" to="620" dur="1.2s" fill="freeze"/></rect></mask>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<rect width="1200" height="520" rx="28" fill="url(#dots)"/>
<rect x="18" y="18" width="1164" height="484" rx="24" fill="none" stroke="url(#g)" stroke-opacity=".7"/>
<g transform="translate(48 48)">
  <rect width="1104" height="424" rx="20" fill="#0d0e16" fill-opacity=".55" stroke="#22d3ee" stroke-opacity=".15"/>
  <g transform="translate(36 32)">
    <rect width="140" height="30" rx="15" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".55"/>
    <circle cx="20" cy="15" r="5" fill="#22d3ee"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="34" y="20" fill="#b8f3ff" font-family="monospace" font-size="12">OPEN TO COLLABS</text>
    <text y="90" fill="#94a3b8" font-family="monospace" font-size="19">Hi there, I'm</text>
    <g mask="url(#reveal)">
      <text y="160" fill="url(#g)" font-family="Arial,sans-serif" font-size="62" font-weight="800">Shekhar Kumar</text>
    </g>
    <text y="205" fill="#f8fafc" font-family="monospace" font-size="22">Full Stack Developer</text>
    <text y="239" fill="#22d3ee" font-family="monospace" font-size="15">
      <tspan>Java Developer</tspan><animate attributeName="opacity" values="1;0;0;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text y="239" fill="#a78bfa" font-family="monospace" font-size="15" opacity="0">Python Developer<animate attributeName="opacity" values="0;0;1;0" dur="6s" repeatCount="indefinite"/></text>
    <text y="239" fill="#f472b6" font-family="monospace" font-size="15" opacity="0">AI &amp; Blockchain Learner<animate attributeName="opacity" values="0;1;0;0" dur="6s" repeatCount="indefinite"/></text>
    <text y="278" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Building modern software while exploring AI, cloud, blockchain &amp; open source.</text>
    <g transform="translate(0 315)">
      <rect width="720" height="48" rx="12" fill="#111522" stroke="#a78bfa" stroke-opacity=".28"/>
      <text x="18" y="30" fill="#94a3b8" font-family="monospace" font-size="13">github</text>
      <text x="72" y="30" fill="#f8fafc" font-family="monospace" font-size="13">@shekharkrkarn</text>
      <text x="300" y="30" fill="#94a3b8" font-family="monospace" font-size="13">focus</text>
      <text x="350" y="30" fill="#22d3ee" font-family="monospace" font-size="13">FULL STACK + AI</text>
    </g>
  </g>
  <g transform="translate(820 62)">
    <rect width="235" height="280" rx="20" fill="#111522" stroke="url(#g)" stroke-opacity=".65"/>
    <text x="20" y="28" fill="#22d3ee" font-family="monospace" font-size="11">PROFILE // LIVE</text>
    <rect x="20" y="52" width="195" height="150" rx="14" fill="#0d0e16" stroke="#334155"/>
    <circle cx="117" cy="116" r="43" fill="#1e293b" stroke="#22d3ee" stroke-opacity=".7"/>
    <text x="117" y="112" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="26" font-weight="700">SK</text>
    <text x="117" y="136" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">DEV PROFILE</text>
    <text x="20" y="230" fill="#cbd5e1" font-family="monospace" font-size="12">STATUS</text>
    <text x="20" y="252" fill="#22d3ee" font-family="monospace" font-size="13">BUILDING • LEARNING</text>
  </g>
  <g transform="translate(1000 22)" stroke="#22d3ee" stroke-width="2" fill="none">
    <path d="M0 0h30v30M0 0v30h30"/><circle cx="5" cy="5" r="3" fill="#f472b6" stroke="none"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>
  </g>
</g>
</svg>